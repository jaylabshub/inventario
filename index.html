<!-- ==========================================================
     BLOCO 1 — FUNÇÕES PURAS (cálculo)
     Recebem dados, devolvem dados. Nunca tocam em document nem em
     localStorage. Se isso mudar, a regra de arquitetura foi quebrada.
     ========================================================== */
-->
<script>
(function () {
  'use strict';

  const NIVEIS = ['palete', 'fiada', 'caixa', 'pacote'];

  // Constrói e valida um fornecedor a partir dos multiplicadores.
  // A hierarquia é contígua de baixo para cima: pacote (sempre) → caixa
  // → fiada → palete. Um nível só existe se todos os de baixo existirem.
  // Rejeita (lança erro) qualquer configuração com um buraco.
  function construirFornecedor(dados) {
    const { id, nome, unidades_por_pacote, pacotes_por_caixa, caixas_por_fiada, fiadas_por_palete } = dados;

    if (!(unidades_por_pacote > 0)) {
      throw new Error(`Fornecedor "${nome}": o pacote tem de ter um número de unidades maior que zero.`);
    }
    if (!(pacotes_por_caixa > 0)) {
      throw new Error(`Fornecedor "${nome}": a caixa tem de ter um número de pacotes maior que zero.`);
    }
    if (caixas_por_fiada != null && !(caixas_por_fiada > 0)) {
      throw new Error(`Fornecedor "${nome}": o número de caixas por fiada tem de ser maior que zero, ou não existir.`);
    }
    if (fiadas_por_palete != null && !(fiadas_por_palete > 0)) {
      throw new Error(`Fornecedor "${nome}": o número de fiadas por palete tem de ser maior que zero, ou não existir.`);
    }
    if (fiadas_por_palete != null && caixas_por_fiada == null) {
      throw new Error(`Fornecedor "${nome}": não pode haver palete sem fiada. A configuração tem um buraco na hierarquia.`);
    }

    return {
      id, nome,
      unidades_por_pacote,
      pacotes_por_caixa,
      caixas_por_fiada: caixas_por_fiada == null ? null : caixas_por_fiada,
      fiadas_por_palete: fiadas_por_palete == null ? null : fiadas_por_palete,
    };
  }

  // Converte valores "unidades por nível" (como vêm da folha antiga) em
  // multiplicadores entre níveis consecutivos. Assinala em `avisos`
  // qualquer divisão que não feche num número inteiro — não rejeita,
  // só sinaliza, porque quem decide o que fazer com isso é quem chama.
  function converterNiveisParaMultiplicadores({ unidadesPacote, unidadesCaixa, unidadesFiada, unidadesPalete }) {
    const avisos = [];
    function dividir(nomeNivel, maior, menor) {
      if (maior == null || menor == null) return null;
      const resultado = maior / menor;
      if (!Number.isInteger(resultado)) {
        avisos.push(`${nomeNivel}: ${maior} / ${menor} = ${resultado}, não é um número inteiro.`);
      }
      return resultado;
    }
    return {
      unidades_por_pacote: unidadesPacote,
      pacotes_por_caixa: dividir('pacotes_por_caixa', unidadesCaixa, unidadesPacote),
      caixas_por_fiada: dividir('caixas_por_fiada', unidadesFiada, unidadesCaixa),
      fiadas_por_palete: dividir('fiadas_por_palete', unidadesPalete, unidadesFiada),
      avisos,
    };
  }

  // Unidades que cada nível vale para um fornecedor. Nível inexistente
  // fica a null.
  function unidadesPorNivel(fornecedor) {
    const pacote = fornecedor.unidades_por_pacote;
    const caixa = fornecedor.pacotes_por_caixa != null ? pacote * fornecedor.pacotes_por_caixa : null;
    const fiada = (caixa != null && fornecedor.caixas_por_fiada != null) ? caixa * fornecedor.caixas_por_fiada : null;
    const palete = (fiada != null && fornecedor.fiadas_por_palete != null) ? fiada * fornecedor.fiadas_por_palete : null;
    return { palete, fiada, caixa, pacote };
  }

  // Total de uma única contagem (um fornecedor, quantidades por nível).
  // Se aparecer quantidade num nível que não existe nesse fornecedor,
  // isso é erro: o total não é dado como bom.
  function calcularTotalContagem(quantidades, fornecedor) {
    const unidades = unidadesPorNivel(fornecedor);
    const erros = [];
    let total = 0;
    for (const nivel of NIVEIS) {
      const qtd = quantidades[nivel] || 0;
      if (qtd === 0) continue;
      if (unidades[nivel] == null) {
        erros.push(`O fornecedor "${fornecedor.nome}" não tem o nível "${nivel}", mas foi contada uma quantidade (${qtd}).`);
        continue;
      }
      total += qtd * unidades[nivel];
    }
    return { total, valido: erros.length === 0, erros };
  }

  // Soma várias contagens do mesmo artigo (cada uma com o seu fornecedor).
  function calcularTotalArtigo(contagens) {
    let total = 0;
    let erros = [];
    for (const c of contagens) {
      const r = calcularTotalContagem(c.quantidades, c.fornecedor);
      total += r.total;
      erros = erros.concat(r.erros);
    }
    return { total, valido: erros.length === 0, erros };
  }

  // Gera o resultado final: todos os artigos da família, pela ordem da
  // configuração, com 0 nos que não tiveram nenhuma contagem.
  function gerarResultado(familia, contagensPorCodigo) {
    const artigosOrdenados = [...familia.artigos].sort((a, b) => a.ordem - b.ordem);
    return artigosOrdenados.map((artigo) => {
      const brutas = contagensPorCodigo[artigo.codigo] || [];
      const contagens = brutas.map((c) => ({
        quantidades: c.quantidades,
        fornecedor: artigo.fornecedores.find((f) => f.id === c.fornecedorId),
      }));
      const r = calcularTotalArtigo(contagens);
      return {
        codigo: artigo.codigo,
        nome: artigo.nome,
        ordem: artigo.ordem,
        total: r.total,
        valido: r.valido,
        erros: r.erros,
      };
    });
  }

  window.Calculo = {
    construirFornecedor,
    converterNiveisParaMultiplicadores,
    unidadesPorNivel,
    calcularTotalContagem,
    calcularTotalArtigo,
    gerarResultado,
  };
})();
</script>

<!-- ==========================================================
     BLOCO 2 — CONFIGURAÇÃO DE EXEMPLO
     Dados genéricos embutidos, usados só quando o telemóvel ainda não
     tem nenhuma configuração real. Códigos e fornecedores fictícios de
     propósito: o repositório é público.
     ========================================================== */
-->
<script>
(function () {
  'use strict';

  // Tabela de origem: valores em UNIDADES POR NÍVEL, tal como vinham na
  // folha antiga. `null` = esse nível não existe para este artigo.
  const TABELA_FORNECEDOR_A = [
    { ordem: 10, codigo: '0001', nome: 'Fralda 13-20 Kg',   unidadesPalete: null, unidadesFiada: 756,  unidadesCaixa: 126, unidadesPacote: 21 },
    { ordem: 20, codigo: '0002', nome: 'Fralda 17-28 Kg',   unidadesPalete: null, unidadesFiada: 720,  unidadesCaixa: 120, unidadesPacote: 20 },
    { ordem: 30, codigo: '0003', nome: 'Fralda S',          unidadesPalete: 2880, unidadesFiada: 720,  unidadesCaixa: 120, unidadesPacote: 30 },
    { ordem: 40, codigo: '0004', nome: 'Fralda M',          unidadesPalete: 2880, unidadesFiada: 720,  unidadesCaixa: 120, unidadesPacote: 30 },
    { ordem: 50, codigo: '0005', nome: 'Fralda L',          unidadesPalete: 2880, unidadesFiada: 720,  unidadesCaixa: 120, unidadesPacote: 30 },
    { ordem: 60, codigo: '0006', nome: 'Fralda XL',         unidadesPalete: 2400, unidadesFiada: 600,  unidadesCaixa: 100, unidadesPacote: 25 },
    { ordem: 70, codigo: '0007', nome: 'Fralda XXL',        unidadesPalete: 2400, unidadesFiada: 600,  unidadesCaixa: 100, unidadesPacote: 25 },
    { ordem: 80, codigo: '0008', nome: 'Cueca Fralda S',    unidadesPalete: null, unidadesFiada: 336,  unidadesCaixa: 84,  unidadesPacote: 14 },
    { ordem: 90, codigo: '0009', nome: 'Cueca Fralda M',    unidadesPalete: 2400, unidadesFiada: 480,  unidadesCaixa: 80,  unidadesPacote: 20 },
    { ordem: 100, codigo: '0010', nome: 'Cueca Fralda L',   unidadesPalete: 1152, unidadesFiada: 288,  unidadesCaixa: 48,  unidadesPacote: 12 },
    { ordem: 110, codigo: '0011', nome: 'Cueca Fralda XL',  unidadesPalete: 1680, unidadesFiada: 240,  unidadesCaixa: 40,  unidadesPacote: 10 },
    { ordem: 120, codigo: '0012', nome: 'Pensos Femininos', unidadesPalete: null, unidadesFiada: 1536, unidadesCaixa: 192, unidadesPacote: 24 },
    { ordem: 130, codigo: '0013', nome: 'Pensos Masculino', unidadesPalete: null, unidadesFiada: 1440, unidadesCaixa: 120, unidadesPacote: 20 },
  ];

  // Fornecedor B só existe para a Fralda XL (código 0006), com uma
  // configuração diferente — é o caso que a app existe para não confundir.
  const FRALDA_XL_FORNECEDOR_B = {
    unidades_por_pacote: 20, pacotes_por_caixa: 4, caixas_por_fiada: 6, fiadas_por_palete: 3,
  };

  const avisosConversao = [];

  const artigos = TABELA_FORNECEDOR_A.map((linha) => {
    const convertido = Calculo.converterNiveisParaMultiplicadores({
      unidadesPacote: linha.unidadesPacote,
      unidadesCaixa: linha.unidadesCaixa,
      unidadesFiada: linha.unidadesFiada,
      unidadesPalete: linha.unidadesPalete,
    });
    if (convertido.avisos.length > 0) {
      avisosConversao.push(`${linha.codigo} ${linha.nome}: ${convertido.avisos.join(' ')}`);
    }

    const fornecedores = [
      Calculo.construirFornecedor({ id: 'forn_a', nome: 'Fornecedor A', ...convertido }),
    ];
    if (linha.codigo === '0006') {
      fornecedores.push(
        Calculo.construirFornecedor({ id: 'forn_b', nome: 'Fornecedor B', ...FRALDA_XL_FORNECEDOR_B })
      );
    }

    return { codigo: linha.codigo, nome: linha.nome, ordem: linha.ordem, fornecedores };
  });

  if (avisosConversao.length > 0) {
    // A configuração de exemplo é fixa e conhecida; se isto disparar,
    // há um erro de transcrição da tabela, não um caso de uso real.
    console.error('Configuração de exemplo com divisões não inteiras:', avisosConversao);
  }

  window.CONFIGURACAO_EXEMPLO = {
    familias: [
      { id: 'fraldas', nome: 'Fraldas', artigos },
    ],
  };
})();
</script>

<!-- ==========================================================
     BLOCO 3 — ARMAZENAMENTO
     O único sítio que fala com localStorage. Nunca chamado a partir do
     bloco de cálculo; só a partir da interface.
     ========================================================== */
-->
<script>
(function () {
  'use strict';

  const CHAVE_CONFIGURACAO = 'contagens_configuracao';
  const chaveContagens = (familiaId) => `contagens_dados_${familiaId}`;

  function obterConfiguracao() {
    const guardada = localStorage.getItem(CHAVE_CONFIGURACAO);
    if (!guardada) return window.CONFIGURACAO_EXEMPLO;
    try {
      return JSON.parse(guardada);
    } catch (e) {
      console.error('Configuração guardada é inválida, a usar a de exemplo.', e);
      return window.CONFIGURACAO_EXEMPLO;
    }
  }

  function guardarConfiguracao(configuracao) {
    localStorage.setItem(CHAVE_CONFIGURACAO, JSON.stringify(configuracao));
  }

  function obterContagens(familiaId) {
    const guardadas = localStorage.getItem(chaveContagens(familiaId));
    if (!guardadas) return {};
    try {
      return JSON.parse(guardadas);
    } catch (e) {
      console.error('Contagens guardadas são inválidas, a começar vazio.', e);
      return {};
    }
  }

  function guardarContagens(familiaId, dados) {
    localStorage.setItem(chaveContagens(familiaId), JSON.stringify(dados));
  }

  window.Armazenamento = { obterConfiguracao, guardarConfiguracao, obterContagens, guardarContagens };
})();
</script>

<!-- ==========================================================
     BLOCO 4 — TESTES
     Corre só com ?teste=1. Usa casos reais da folha que a app substitui.
     ========================================================== */
-->
<script>
(function () {
  'use strict';

  const TESTES = [];
  function teste(nome, fn) { TESTES.push({ nome, fn }); }

  function assertIgual(atual, esperado, msg) {
    if (atual !== esperado) {
      throw new Error(`${msg ? msg + ' — ' : ''}esperado ${JSON.stringify(esperado)}, obtido ${JSON.stringify(atual)}`);
    }
  }
  function assertVerdadeiro(valor, msg) {
    if (valor !== true) throw new Error(msg || 'esperava-se verdadeiro');
  }
  function assertLanca(fn, msg) {
    try {
      fn();
    } catch (e) {
      return;
    }
    throw new Error(msg || 'esperava-se que a função lançasse um erro, e não lançou');
  }

  function artigo(codigo) {
    const familia = window.CONFIGURACAO_EXEMPLO.familias[0];
    const a = familia.artigos.find((x) => x.codigo === codigo);
    if (!a) throw new Error(`Artigo de teste ${codigo} não encontrado na configuração de exemplo.`);
    return a;
  }
  function fornecedor(codigo, fornecedorId) {
    const f = artigo(codigo).fornecedores.find((x) => x.id === fornecedorId);
    if (!f) throw new Error(`Fornecedor ${fornecedorId} não encontrado no artigo ${codigo}.`);
    return f;
  }

  teste('Fralda XL, Fornecedor A: 2 paletes + 2 fiadas + 3 caixas + 1 pacote = 6 325 unidades', () => {
    const r = Calculo.calcularTotalContagem({ palete: 2, fiada: 2, caixa: 3, pacote: 1 }, fornecedor('0006', 'forn_a'));
    assertVerdadeiro(r.valido, 'a contagem deveria ser válida');
    assertIgual(r.total, 6325, 'total da Fralda XL, Fornecedor A');
  });

  teste('Fralda L: 8 paletes + 3 fiadas + 4 caixas = 25 680 unidades', () => {
    const r = Calculo.calcularTotalContagem({ palete: 8, fiada: 3, caixa: 4 }, fornecedor('0005', 'forn_a'));
    assertVerdadeiro(r.valido, 'a contagem deveria ser válida');
    assertIgual(r.total, 25680, 'total da Fralda L');
  });

  teste('Cueca Fralda L: 4 caixas + 2 pacotes = 216 unidades', () => {
    const r = Calculo.calcularTotalContagem({ caixa: 4, pacote: 2 }, fornecedor('0010', 'forn_a'));
    assertVerdadeiro(r.valido, 'a contagem deveria ser válida');
    assertIgual(r.total, 216, 'total da Cueca Fralda L');
  });

  teste('A mesma Fralda XL com Fornecedor A e Fornecedor B dá totais diferentes', () => {
    const quantidades = { palete: 1 };
    const totalA = Calculo.calcularTotalContagem(quantidades, fornecedor('0006', 'forn_a')).total;
    const totalB = Calculo.calcularTotalContagem(quantidades, fornecedor('0006', 'forn_b')).total;
    assertIgual(totalA, 2400, 'total Fornecedor A');
    assertIgual(totalB, 1440, 'total Fornecedor B');
    if (totalA === totalB) throw new Error('os totais deveriam ser diferentes e são iguais');
  });

  teste('Artigo sem palete (Fralda 13-20 Kg): contar palete dá erro', () => {
    const r = Calculo.calcularTotalContagem({ palete: 1 }, fornecedor('0001', 'forn_a'));
    assertVerdadeiro(!r.valido, 'deveria ser inválido');
    assertVerdadeiro(r.erros.length > 0, 'deveria ter pelo menos um erro');
  });

  teste('Configuração com buraco na hierarquia é recusada (palete sem fiada)', () => {
    assertLanca(() => {
      Calculo.construirFornecedor({
        id: 'forn_furado', nome: 'Fornecedor Furado',
        unidades_por_pacote: 10, pacotes_por_caixa: 4,
        caixas_por_fiada: null, fiadas_por_palete: 3,
      });
    }, 'deveria recusar palete sem fiada');
  });

  teste('Várias contagens do mesmo artigo somam', () => {
    const f = fornecedor('0006', 'forn_a');
    const r = Calculo.calcularTotalArtigo([
      { quantidades: { pacote: 1 }, fornecedor: f },
      { quantidades: { caixa: 1 }, fornecedor: f },
    ]);
    assertVerdadeiro(r.valido, 'deveria ser válido');
    assertIgual(r.total, 125, '25 (1 pacote) + 100 (1 caixa)');
  });

  teste('O resultado sai com os 13 artigos, pela ordem da configuração, com 0 nos não contados', () => {
    const familia = window.CONFIGURACAO_EXEMPLO.familias[0];
    const resultado = Calculo.gerarResultado(familia, {
      '0006': [{ fornecedorId: 'forn_a', quantidades: { palete: 1 } }],
    });
    assertIgual(resultado.length, 13, 'número de artigos no resultado');
    for (let i = 1; i < resultado.length; i++) {
      assertVerdadeiro(resultado[i].ordem > resultado[i - 1].ordem, 'a ordem tem de ser crescente e seguir a configuração');
    }
    const naoContado = resultado.find((r) => r.codigo === '0001');
    assertIgual(naoContado.total, 0, 'artigo não contado deveria ter total 0');
    const contado = resultado.find((r) => r.codigo === '0006');
    assertIgual(contado.total, 2400, 'artigo contado deveria ter o total certo');
  });

  teste('A conversão de unidades-por-nível para multiplicadores fecha em número inteiro nos 13 artigos', () => {
    const familia = window.CONFIGURACAO_EXEMPLO.familias[0];
    assertIgual(familia.artigos.length, 13, 'a configuração de exemplo deveria ter 13 artigos');
    // Se algum multiplicador não fechasse em inteiro, converterNiveisParaMultiplicadores
    // teria posto avisos, e o bloco de configuração já os teria mandado para a consola.
    for (const a of familia.artigos) {
      for (const f of a.fornecedores) {
        for (const chave of ['pacotes_por_caixa', 'caixas_por_fiada', 'fiadas_por_palete']) {
          const v = f[chave];
          if (v != null) assertVerdadeiro(Number.isInteger(v), `${a.codigo} ${f.nome} ${chave} deveria ser inteiro, é ${v}`);
        }
      }
    }
  });

  window.TESTES = TESTES;
})();
</script>

<!-- ==========================================================
     BLOCO 5 — INTERFACE
     Só isto lê o DOM e fala com Armazenamento. Nada aqui contém regras
     de negócio — isso vive todo no bloco de cálculo.

     Fluxo de uma contagem: escolher artigo (ou criar um novo) → escolher
     fornecedor (ou criar um novo) → quantidades por nível → observação
     → volta ao histórico. Cada contagem é sempre um artigo + um
     fornecedor. Navegar entre estes passos usa o histórico do browser
     (pushState/popstate), para o botão físico de "voltar" funcionar.
     ========================================================== */
-->
<body>
  <div id="app"></div>
  <script>
  (function () {
    'use strict';

    const app = document.getElementById('app');
    const modoTeste = new URLSearchParams(window.location.search).get('teste') === '1';

    if (modoTeste) {
      iniciarEcraDeTestes();
    } else {
      iniciarEcraDeContagem();
    }

    function iniciarEcraDeTestes() {
      const resultados = window.TESTES.map(({ nome, fn }) => {
        try {
          fn();
          return { nome, ok: true };
        } catch (e) {
          return { nome, ok: false, motivo: e.message };
        }
      });

      const falhas = resultados.filter((r) => !r.ok).length;

      app.innerHTML = `
        <div class="testes">
          <h1>Testes</h1>
          <p class="resumo">${resultados.length - falhas} / ${resultados.length} a passar</p>
          <ul>
            ${resultados.map((r) => `
              <li class="${r.ok ? 'ok' : 'falha'}">
                ${r.ok ? '✓' : '✗'} ${r.nome}
                ${r.ok ? '' : `<span class="motivo">${r.motivo}</span>`}
              </li>
            `).join('')}
          </ul>
        </div>
      `;
    }

    function iniciarEcraDeContagem() {
      const configuracao = Armazenamento.obterConfiguracao();
      const familia = configuracao.familias.find((f) => f.id === 'fraldas') || configuracao.familias[0];
      const estado = Armazenamento.obterContagens(familia.id);

      let vista = { ecra: 'inicio' };

      function guardarConfig() { Armazenamento.guardarConfiguracao(configuracao); }
      function guardarDados() { Armazenamento.guardarContagens(familia.id, estado); }

      function artigosOrdenados() { return [...familia.artigos].sort((a, b) => a.ordem - b.ordem); }
      function artigoPorCodigo(codigo) { return familia.artigos.find((a) => a.codigo === codigo) || null; }
      function fornecedorDe(artigo, fornecedorId) { return artigo.fornecedores.find((f) => f.id === fornecedorId) || null; }
      function dadosArtigo(codigo) {
        if (!estado[codigo]) estado[codigo] = { contagens: [], observacoes: '' };
        return estado[codigo];
      }
      function novoId(prefixo) { return `${prefixo}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`; }

      function formatarNumero(n) { return new Intl.NumberFormat('pt-PT').format(n); }
      function escaparTexto(texto) {
        return String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function subtotalLinha(artigo, linha) {
        const fornecedor = fornecedorDe(artigo, linha.fornecedorId);
        if (!fornecedor) return { total: 0, valido: true, erros: [], fornecedor: null };
        return { ...Calculo.calcularTotalContagem(linha.quantidades, fornecedor), fornecedor };
      }
      function linhaTemConteudo(linha) {
        return Object.values(linha.quantidades).some((v) => v > 0);
      }

      function configBlocoHTML(fornecedor) {
        const u = Calculo.unidadesPorNivel(fornecedor);
        const linhas = [];
        if (u.palete != null) linhas.push(`<div>1 palete = ${fornecedor.fiadas_por_palete} fiadas <b>${formatarNumero(u.palete)} un</b></div>`);
        if (u.fiada != null) linhas.push(`<div>1 fiada = ${fornecedor.caixas_por_fiada} caixas <b>${formatarNumero(u.fiada)} un</b></div>`);
        linhas.push(`<div>1 caixa = ${fornecedor.pacotes_por_caixa} pacotes <b>${formatarNumero(u.caixa)} un</b></div>`);
        linhas.push(`<div>1 pacote <b>${formatarNumero(u.pacote)} un</b></div>`);
        return `<div class="config-bloco">${linhas.join('')}</div>`;
      }

      function nivelInputHTML(nivel, valor) {
        const nomes = { palete: 'Palete', fiada: 'Fiada', caixa: 'Caixa', pacote: 'Pacote' };
        return `
          <div class="nivel-linha" data-nivel="${nivel}">
            <span class="nivel-nome">${nomes[nivel]}</span>
            <button type="button" class="btn-menos" aria-label="Diminuir ${nomes[nivel]}">–</button>
            <input type="text" inputmode="numeric" pattern="[0-9]*" class="nivel-input" value="${valor || ''}">
            <button type="button" class="btn-mais" aria-label="Aumentar ${nomes[nivel]}">+</button>
          </div>
        `;
      }

      // ---------- navegação interna (sem sair da página, mas com histórico do browser) ----------

      function irPara(novaVista, opcoes) {
        vista = novaVista;
        if (opcoes && opcoes.substituir) history.replaceState(vista, '');
        else history.pushState(vista, '');
        renderizar();
      }
      window.addEventListener('popstate', (e) => {
        vista = e.state || { ecra: 'inicio' };
        renderizar();
      });
      history.replaceState(vista, '');

      function topoContagem(titulo) {
        return `
          <div class="topo">
            <button type="button" class="btn-voltar" id="btn-voltar" aria-label="Voltar">‹</button>
            <h1>${escaparTexto(titulo)}</h1>
          </div>
        `;
      }
      function ligarBotaoVoltar() {
        document.getElementById('btn-voltar').addEventListener('click', () => history.back());
      }

      // ---------- ecrã INÍCIO (histórico / totais) ----------

      let abaInicio = 'historico';

      function linhasHistorico() {
        const linhas = [];
        for (const artigo of artigosOrdenados()) {
          const dados = estado[artigo.codigo];
          if (!dados) continue;
          for (const linha of dados.contagens) {
            if (!linhaTemConteudo(linha)) continue;
            linhas.push({ artigo, linha });
          }
        }
        return linhas;
      }

      function tabelaHistoricoHTML() {
        const linhas = linhasHistorico();
        if (linhas.length === 0) return `<p class="historico-vazio">Ainda não há nenhuma contagem.</p>`;
        const celula = (fornecedor, linha, nivel) => {
          if (!fornecedor || Calculo.unidadesPorNivel(fornecedor)[nivel] == null) return '–';
          return formatarNumero(linha.quantidades[nivel] || 0);
        };
        return `
          <div class="tabela-wrap">
            <table class="tabela">
              <thead>
                <tr>
                  <th>Artigo</th><th>Fornecedor</th><th>Pacotes</th><th>Caixas</th><th>Fiadas</th><th>Paletes</th><th>Total</th><th></th>
                </tr>
              </thead>
              <tbody>
                ${linhas.map(({ artigo, linha }) => {
                  const r = subtotalLinha(artigo, linha);
                  return `
                    <tr class="${r.valido ? '' : 'erro'}" data-codigo="${artigo.codigo}" data-id="${linha.id}">
                      <td><button type="button" class="historico-abrir">${artigo.codigo} · ${escaparTexto(artigo.nome)}</button></td>
                      <td>${r.fornecedor ? escaparTexto(r.fornecedor.nome) : ''}</td>
                      <td>${celula(r.fornecedor, linha, 'pacote')}</td>
                      <td>${celula(r.fornecedor, linha, 'caixa')}</td>
                      <td>${celula(r.fornecedor, linha, 'fiada')}</td>
                      <td>${celula(r.fornecedor, linha, 'palete')}</td>
                      <td class="celula-total ${r.valido ? '' : 'erro'}">${r.valido ? formatarNumero(r.total) : '⚠'}</td>
                      <td><button type="button" class="historico-remover" aria-label="Remover esta contagem">✕</button></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function tabelaTotaisHTML() {
        const contagensPorCodigo = {};
        for (const artigo of familia.artigos) {
          const dados = estado[artigo.codigo];
          if (!dados) continue;
          contagensPorCodigo[artigo.codigo] = dados.contagens
            .filter(linhaTemConteudo)
            .map((linha) => ({ fornecedorId: linha.fornecedorId, quantidades: linha.quantidades }));
        }
        const resultado = Calculo.gerarResultado(familia, contagensPorCodigo);
        const tudoValido = resultado.every((r) => r.valido);
        const totalGeral = resultado.reduce((soma, r) => soma + r.total, 0);
        return `
          <div class="tabela-wrap">
            <table class="tabela">
              <thead><tr><th>Artigo</th><th>Total</th></tr></thead>
              <tbody>
                ${resultado.map((r) => `
                  <tr class="${r.valido ? '' : 'erro'}">
                    <td>${r.codigo} · ${escaparTexto(r.nome)}</td>
                    <td class="celula-total ${r.valido ? '' : 'erro'}">${r.valido ? formatarNumero(r.total) : '⚠'}</td>
                  </tr>
                `).join('')}
              </tbody>
              <tfoot>
                <tr><td>Total geral</td><td class="celula-total ${tudoValido ? '' : 'erro'}">${tudoValido ? formatarNumero(totalGeral) : '⚠ há erros por resolver'}</td></tr>
              </tfoot>
            </table>
          </div>
        `;
      }

      function renderInicio() {
        app.innerHTML = `
          <div class="topo"><h1>${escaparTexto(familia.nome)}</h1></div>
          <button type="button" class="btn-primario" id="btn-nova-contagem">+ Nova contagem</button>
          <div class="abas">
            <button type="button" class="aba ${abaInicio === 'historico' ? 'ativa' : ''}" data-aba="historico">Histórico</button>
            <button type="button" class="aba ${abaInicio === 'totais' ? 'ativa' : ''}" data-aba="totais">Totais</button>
          </div>
          ${abaInicio === 'historico' ? tabelaHistoricoHTML() : tabelaTotaisHTML()}
        `;

        document.getElementById('btn-nova-contagem').addEventListener('click', () => {
          irPara({ ecra: 'contagem', passo: 'artigo' });
        });
        app.querySelectorAll('.aba').forEach((btn) => {
          btn.addEventListener('click', () => {
            abaInicio = btn.dataset.aba;
            renderInicio();
          });
        });
        app.querySelectorAll('.historico-abrir').forEach((btn) => {
          btn.addEventListener('click', () => {
            const linhaEl = btn.closest('tr');
            irPara({ ecra: 'contagem', passo: 'quantidades', codigo: linhaEl.dataset.codigo, id: linhaEl.dataset.id });
          });
        });
        app.querySelectorAll('.historico-remover').forEach((btn) => {
          btn.addEventListener('click', () => {
            const linhaEl = btn.closest('tr');
            const dados = dadosArtigo(linhaEl.dataset.codigo);
            dados.contagens = dados.contagens.filter((c) => c.id !== linhaEl.dataset.id);
            guardarDados();
            renderInicio();
          });
        });
      }

      // ---------- passo: escolher artigo ----------

      function abrirQuantidades(codigo, fornecedorId, opcoes) {
        const dados = dadosArtigo(codigo);
        const id = novoId('cont');
        dados.contagens.push({ id, fornecedorId, quantidades: {} });
        guardarDados();
        irPara({ ecra: 'contagem', passo: 'quantidades', codigo, id }, opcoes);
      }

      function renderPassoArtigo() {
        app.innerHTML = `
          ${topoContagem('Escolher artigo')}
          <div class="campo">
            <label for="campo-artigo">Artigo</label>
            <select id="campo-artigo">
              <option value="" selected disabled>Escolher…</option>
              ${artigosOrdenados().map((a) => `<option value="${a.codigo}">${a.codigo} · ${escaparTexto(a.nome)}</option>`).join('')}
              <option value="__novo__">+ Artigo novo</option>
            </select>
          </div>
        `;
        ligarBotaoVoltar();
        document.getElementById('campo-artigo').addEventListener('change', (e) => {
          const valor = e.target.value;
          if (valor === '__novo__') {
            irPara({ ecra: 'contagem', passo: 'novoArtigo' });
            return;
          }
          const artigo = artigoPorCodigo(valor);
          if (artigo.fornecedores.length === 1) {
            abrirQuantidades(artigo.codigo, artigo.fornecedores[0].id);
          } else {
            irPara({ ecra: 'contagem', passo: 'fornecedor', codigo: artigo.codigo });
          }
        });
      }

      // ---------- passo: artigo novo ----------

      function renderPassoNovoArtigo() {
        app.innerHTML = `
          ${topoContagem('Artigo novo')}
          <div id="erro-artigo"></div>
          <div class="campo"><label for="novo-codigo">Código</label><input type="text" id="novo-codigo"></div>
          <div class="campo"><label for="novo-nome">Nome</label><input type="text" id="novo-nome"></div>
          <button type="button" class="btn-primario" id="btn-criar-artigo">Criar artigo</button>
        `;
        ligarBotaoVoltar();
        document.getElementById('btn-criar-artigo').addEventListener('click', () => {
          const codigo = document.getElementById('novo-codigo').value.trim();
          const nome = document.getElementById('novo-nome').value.trim();
          const erroEl = document.getElementById('erro-artigo');
          if (!codigo || !nome) {
            erroEl.innerHTML = `<p class="erro-mensagem">Preenche o código e o nome.</p>`;
            return;
          }
          if (artigoPorCodigo(codigo)) {
            erroEl.innerHTML = `<p class="erro-mensagem">Já existe um artigo com o código "${escaparTexto(codigo)}".</p>`;
            return;
          }
          const maiorOrdem = familia.artigos.reduce((max, a) => Math.max(max, a.ordem), 0);
          const artigo = { codigo, nome, ordem: maiorOrdem + 10, fornecedores: [] };
          familia.artigos.push(artigo);
          guardarConfig();
          irPara({ ecra: 'contagem', passo: 'novoFornecedor', codigo: artigo.codigo }, { substituir: true });
        });
      }

      // ---------- passo: escolher fornecedor ----------

      function renderPassoFornecedor() {
        const artigo = artigoPorCodigo(vista.codigo);
        app.innerHTML = `
          ${topoContagem(artigo.nome)}
          <div class="campo">
            <label for="campo-fornecedor">Fornecedor</label>
            <select id="campo-fornecedor">
              <option value="" selected disabled>Escolher…</option>
              ${artigo.fornecedores.map((f) => `<option value="${f.id}">${escaparTexto(f.nome)}</option>`).join('')}
              <option value="__novo__">+ Fornecedor novo</option>
            </select>
          </div>
        `;
        ligarBotaoVoltar();
        document.getElementById('campo-fornecedor').addEventListener('change', (e) => {
          const valor = e.target.value;
          if (valor === '__novo__') {
            irPara({ ecra: 'contagem', passo: 'novoFornecedor', codigo: artigo.codigo });
          } else {
            abrirQuantidades(artigo.codigo, valor);
          }
        });
      }

      // ---------- passo: fornecedor novo ----------

      function renderPassoNovoFornecedor() {
        const artigo = artigoPorCodigo(vista.codigo);
        app.innerHTML = `
          ${topoContagem(`${artigo.nome} — fornecedor novo`)}
          <div id="erro-fornecedor"></div>
          <div class="campo"><label for="f-nome">Nome do fornecedor</label><input type="text" id="f-nome"></div>
          <div class="campo"><label for="f-pacote">Unidades por pacote</label><input type="number" inputmode="numeric" id="f-pacote"></div>
          <div class="campo"><label for="f-caixa">Pacotes por caixa</label><input type="number" inputmode="numeric" id="f-caixa"></div>
          <label class="toggle-linha"><input type="checkbox" id="f-tem-fiada"> Este fornecedor tem fiada</label>
          <div class="campo" id="bloco-fiada" style="display:none">
            <label for="f-fiada">Caixas por fiada</label><input type="number" inputmode="numeric" id="f-fiada">
          </div>
          <label class="toggle-linha" id="linha-tem-palete" style="display:none">
            <input type="checkbox" id="f-tem-palete"> Este fornecedor tem palete
          </label>
          <div class="campo" id="bloco-palete" style="display:none">
            <label for="f-palete">Fiadas por palete</label><input type="number" inputmode="numeric" id="f-palete">
          </div>
          <button type="button" class="btn-primario" id="btn-criar-fornecedor">Criar fornecedor</button>
        `;
        ligarBotaoVoltar();

        document.getElementById('f-tem-fiada').addEventListener('change', (e) => {
          document.getElementById('bloco-fiada').style.display = e.target.checked ? '' : 'none';
          document.getElementById('linha-tem-palete').style.display = e.target.checked ? '' : 'none';
          if (!e.target.checked) {
            document.getElementById('f-tem-palete').checked = false;
            document.getElementById('bloco-palete').style.display = 'none';
          }
        });
        document.getElementById('f-tem-palete').addEventListener('change', (e) => {
          document.getElementById('bloco-palete').style.display = e.target.checked ? '' : 'none';
        });

        document.getElementById('btn-criar-fornecedor').addEventListener('click', () => {
          const erroEl = document.getElementById('erro-fornecedor');
          const nome = document.getElementById('f-nome').value.trim();
          const unidades_por_pacote = Number(document.getElementById('f-pacote').value);
          const pacotes_por_caixa = Number(document.getElementById('f-caixa').value);
          const temFiada = document.getElementById('f-tem-fiada').checked;
          const temPalete = document.getElementById('f-tem-palete').checked;
          const caixas_por_fiada = temFiada ? Number(document.getElementById('f-fiada').value) : null;
          const fiadas_por_palete = temPalete ? Number(document.getElementById('f-palete').value) : null;

          if (!nome) {
            erroEl.innerHTML = `<p class="erro-mensagem">Dá um nome ao fornecedor.</p>`;
            return;
          }
          try {
            const fornecedor = Calculo.construirFornecedor({
              id: novoId('forn'), nome, unidades_por_pacote, pacotes_por_caixa, caixas_por_fiada, fiadas_por_palete,
            });
            artigo.fornecedores.push(fornecedor);
            guardarConfig();
            abrirQuantidades(artigo.codigo, fornecedor.id, { substituir: true });
          } catch (erro) {
            erroEl.innerHTML = `<p class="erro-mensagem">${escaparTexto(erro.message)}</p>`;
          }
        });
      }

      // ---------- passo: quantidades ----------

      function renderPassoQuantidades() {
        const artigo = artigoPorCodigo(vista.codigo);
        const dados = dadosArtigo(artigo.codigo);
        const linha = dados.contagens.find((c) => c.id === vista.id);
        const fornecedor = fornecedorDe(artigo, linha.fornecedorId);
        const r = subtotalLinha(artigo, linha);

        app.innerHTML = `
          ${topoContagem(artigo.nome)}
          <p class="fornecedor-info">${escaparTexto(fornecedor.nome)}</p>
          ${configBlocoHTML(fornecedor)}
          <div class="niveis">
            ${['palete', 'fiada', 'caixa', 'pacote']
              .filter((n) => Calculo.unidadesPorNivel(fornecedor)[n] != null)
              .map((n) => nivelInputHTML(n, linha.quantidades[n])).join('')}
          </div>
          <div class="subtotal-contagem ${r.valido ? '' : 'erro'}">${r.valido ? `${formatarNumero(r.total)} un` : `⚠ ${r.erros[0]}`}</div>
          <textarea class="observacoes-input" id="campo-observacoes" placeholder="Observações (opcional)">${escaparTexto(dados.observacoes || '')}</textarea>
          <button type="button" class="btn-concluir" id="btn-concluir">Concluído</button>
        `;

        ligarBotaoVoltar();
        document.getElementById('btn-concluir').addEventListener('click', () => {
          irPara({ ecra: 'inicio' }, { substituir: true });
        });

        app.querySelectorAll('.nivel-linha').forEach((linhaEl) => {
          const nivel = linhaEl.dataset.nivel;
          const input = linhaEl.querySelector('.nivel-input');

          function aplicar(novoValor) {
            linha.quantidades[nivel] = novoValor;
            guardarDados();
            input.value = novoValor === 0 ? '' : String(novoValor);
            const rNovo = subtotalLinha(artigo, linha);
            const subtotalEl = app.querySelector('.subtotal-contagem');
            subtotalEl.textContent = rNovo.valido ? `${formatarNumero(rNovo.total)} un` : `⚠ ${rNovo.erros[0]}`;
            subtotalEl.classList.toggle('erro', !rNovo.valido);
          }

          linhaEl.querySelector('.btn-mais').addEventListener('click', () => aplicar((linha.quantidades[nivel] || 0) + 1));
          linhaEl.querySelector('.btn-menos').addEventListener('click', () => aplicar(Math.max(0, (linha.quantidades[nivel] || 0) - 1)));
          input.addEventListener('input', () => {
            const limpo = input.value.replace(/\D/g, '');
            if (limpo !== input.value) input.value = limpo;
            aplicar(limpo === '' ? 0 : parseInt(limpo, 10));
          });
        });

        document.getElementById('campo-observacoes').addEventListener('input', (e) => {
          dados.observacoes = e.target.value;
          guardarDados();
        });
      }

      // ---------- despacho ----------

      function renderizar() {
        if (vista.ecra === 'inicio') {
          renderInicio();
          return;
        }
        if (vista.passo === 'artigo') renderPassoArtigo();
        else if (vista.passo === 'novoArtigo') renderPassoNovoArtigo();
        else if (vista.passo === 'fornecedor') renderPassoFornecedor();
        else if (vista.passo === 'novoFornecedor') renderPassoNovoFornecedor();
        else if (vista.passo === 'quantidades') renderPassoQuantidades();
      }

      renderizar();
    }
  })();
  </script>
</body>
</html>
